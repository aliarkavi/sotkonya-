name: sotkonya
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.2+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  phosphor_flutter: ^2.1.0  
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  badges: ^3.1.2
  flutter_staggered_grid_view: ^0.7.0
  carousel_slider: ^5.1.1
  smooth_page_indicator: ^3.0.0
  lottie: ^3.6.1

  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  firebase_storage: ^13.0.2
  image_picker: ^1.2.3
  fluttertoast: ^10.0.0
  shared_preferences: ^2.1.1
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  package_info_plus: ^10.2.1
  uuid: ^4.5.2
  path_provider: ^2.0.15
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^22.3.1
  permission_handler: ^13.0.2
  shimmer: ^4.0.0

  flutter_native_splash: ^2.4.4
  flutter_linkify: ^6.0.0
  timeago: ^3.7.1
  flutter_riverpod: ^3.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/font/
    - assets/images/

  fonts:
    - family: Tajawal 
      fonts:
        - asset: assets/font/tajawal/Tajawal-Extralight.ttf
          weight: 100
        - asset: assets/font/tajawal/Tajawal-Light.ttf
          weight: 200
        - asset: assets/font/tajawal/Tajawal-Regular.ttf
          weight: 300
        - asset: assets/font/tajawal/Tajawal-Medium.ttf
          weight: 400
        - asset: assets/font/tajawal/Tajawal-Bold.ttf
          weight: 500

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/splash_logo1.png"

# ------------------------------------------------------------------
# ✅ Native Splash Screen (الحل الحقيقي لمشكلة التحميل عند الفتح)
# ------------------------------------------------------------------
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/splash_logo1.png

  android_12:
    color: "#FFFFFF"
    image: assets/images/splash_logo1.png

  android: true
  ios: true
  web: false
