name: sotkonya
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: 0.20.2

  phosphor_flutter: ^1.0.0  
  cupertino_icons: ^1.0.8
  google_fonts: ^4.0.3
  badges: ^3.1.2
  flutter_staggered_grid_view: ^0.6.2
  carousel_slider: ^4.2.1
  smooth_page_indicator: ^1.0.0+2
  lottie: ^2.3.0

  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  firebase_storage: ^13.0.2
  provider: ^6.1.5+1
  image_picker: ^0.8.7+5
  fluttertoast: ^8.2.1
  shared_preferences: ^2.1.1
  url_launcher: ^6.1.7
  share_plus: 12.0.1
  package_info_plus: ^9.0.0
  uuid: ^4.5.2
  path_provider: ^2.0.15

  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/font/
    - assets/images/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/font/tajawal/Tajawal-Extralight.ttf
          weight: 100
        - asset: assets/font/tajawal/Tajawal-Light.ttf
          weight: 200
        - asset: assets/font/tajawal/Tajawal-Regular.ttf
          weight: 300
        - asset: assets/font/tajawal/Tajawal-Medium.ttf
          weight: 400
        - asset: assets/font/tajawal/Tajawal-Bold.ttf
          weight: 500

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
